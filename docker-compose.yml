services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: jobezee
      POSTGRES_USER: jobezee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobezee"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobezee:${POSTGRES_PASSWORD}@postgres:5432/jobezee
      PORT: "8000"
      BOT_WORKER_URL: "http://host.docker.internal:8001"
      FRONTEND_URL: "https://jobezee.org"
      CORS_ORIGINS: "https://jobezee.org,https://www.jobezee.org,http://localhost:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./job_outputs:/app/job_outputs

volumes:
  postgres_data:
