# PHASE1_JOB_SEARCH — Global Career Sites Registry
# =================================================
# Used by SmartExtract (Playwright + LLM) to discover jobs from any site.
#
# Each site has:
#   name    : human-readable label
#   url     : URL with optional placeholders:
#               {query_encoded}    -> URL-encoded search term
#               {query}            -> raw search term
#               {location_encoded} -> URL-encoded location string
#   type    : "search"  — URL accepts query/location params (one target per query)
#             "static"  — scraped as-is, no query params (one target total)
#   region  : "global" | "north_america" | "europe" | "asia_pacific" |
#              "middle_east" | "latin_america" | "africa"
#   country : optional ISO country name (omit for multi-country/global boards)
#
# UserPreferences.get_site_targets() filters this list automatically based
# on the user's regions. Sites tagged region="global" are ALWAYS included.
#
# Manual-only ATS (unsolvable CAPTCHAs — flag as manual, do not automate):
manual_ats:
  - "ibegin.tcsapps.com"

# Blocked sites — too anti-bot or unreliable for extraction:
blocked:
  - "glassdoor.com"
  - "google.com/about/careers"
  - "accenture.com"

sites:

  # =========================================================================
  # GLOBAL / Remote-first  (always included regardless of user region)
