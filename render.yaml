services:
  - type: web
    name: jobezee-api
    runtime: python
    buildCommand: >-
      apt-get update -qq &&
      apt-get install -y --no-install-recommends xvfb python3-tk python3-dev wget ca-certificates &&
      wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb &&
      apt-get install -y /tmp/chrome.deb &&
      rm /tmp/chrome.deb &&
      pip install -r backend/requirements.txt &&
      google-chrome --version || google-chrome-stable --version || echo "Chrome version check failed"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://jobezee.org,https://www.jobezee.org,http://localhost:5173"
      - key: UPLOAD_DIR
        value: uploads
      - key: DEBUG
        value: "false"
