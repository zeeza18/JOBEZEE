services:
  - type: web
    name: jobezee-api
    runtime: python
    buildCommand: >-
      apt-get update -qq &&
      apt-get install -y --no-install-recommends xvfb chromium-browser chromium-chromedriver python3-tk python3-dev &&
      pip install -r backend/requirements.txt &&
      python -c "
import shutil, subprocess
cb = shutil.which('chromium-browser') or shutil.which('chromium') or ''
cd = shutil.which('chromedriver') or ''
print('Chrome binary:', cb or 'NOT FOUND')
print('Chromedriver  :', cd or 'NOT FOUND')
if cb and cd:
    from selenium import webdriver
    from selenium.webdriver.chrome.options import Options
    from selenium.webdriver.chrome.service import Service
    o = Options()
    o.binary_location = cb
    o.add_argument('--headless')
    o.add_argument('--no-sandbox')
    o.add_argument('--disable-dev-shm-usage')
    o.add_argument('--disable-gpu')
    o.add_argument('--window-size=1920,1080')
    d = webdriver.Chrome(service=Service(cd), options=o)
    d.quit()
    print('Chrome pre-warm OK')
else:
    print('Skipping pre-warm — binary missing')
" || echo "Pre-warm failed (non-fatal)"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://jobezee.org,https://www.jobezee.org,http://localhost:5173"
      - key: UPLOAD_DIR
        value: uploads
      - key: DEBUG
        value: "false"
