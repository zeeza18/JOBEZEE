services:
  - type: web
    name: jobezee-api
    runtime: python
    buildCommand: >-
      apt-get install -y xvfb wget python3-tk python3-dev &&
      wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb &&
      apt-get install -y /tmp/google-chrome.deb &&
      pip install -r backend/requirements.txt &&
      python -c "from webdriver_manager.chrome import ChromeDriverManager; p=ChromeDriverManager().install(); print('ChromeDriver cached at:', p)" || true
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: DEBUG
        value: "false"
