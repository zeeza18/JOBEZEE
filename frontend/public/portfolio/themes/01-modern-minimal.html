<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern Minimal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>
    const THEME_SLUG = 'modern-minimal'
    Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([key, value]) => document.documentElement.style.setProperty(key, value))
  </script>
  <style>
    :root { --shadow: 0 20px 40px rgba(15,23,42,.07); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); }
    a, button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .shell { max-width: 800px; margin: 0 auto; padding: 0 24px 80px; }
    .nav { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 22px 0; background: rgba(250,250,250,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--color-border); }
    .brand, .nav-links a { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 18px; color: var(--color-muted); }
    section { padding-top: 90px; }
    .hero { padding-top: 76px; }
    .eyebrow { color: var(--color-accent); text-transform: uppercase; letter-spacing: .2em; font-size: 12px; }
    h1, h2, h3 { font-family: var(--font-heading); color: var(--color-primary); margin: 0; }
    h1 { font-size: clamp(48px, 9vw, 96px); line-height: .92; margin-top: 12px; }
    .sub { font-size: 22px; color: var(--color-muted); margin: 16px 0 18px; }
    .lead { font-size: 18px; line-height: 1.75; max-width: 64ch; }
    .hero-row { display: grid; grid-template-columns: 1fr 140px; gap: 28px; align-items: start; }
    .avatar { width: 140px; aspect-ratio: 1; object-fit: cover; border-radius: 20px; border: 1px solid var(--color-border); }
    .btns { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .btn { padding: 12px 18px; border-radius: 999px; border: 1px solid var(--color-border); transition: transform .2s ease, box-shadow .2s ease; }
    .btn:hover, .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .section-head { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 24px; }
    .cards { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 20px; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
    .card-body { padding: 18px; }
    .tags, .contact-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { border: 1px solid var(--color-border); border-radius: 999px; padding: 6px 10px; color: var(--color-muted); font-size: 13px; }
    .skills { display: grid; gap: 14px; }
    .skill-top { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .bar { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--color-border) 70%, white); overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--color-accent); }
    .timeline { border-left: 2px solid var(--color-accent); padding-left: 18px; display: grid; gap: 18px; }
    .edu, .contact-card { border-top: 1px solid var(--color-border); padding-top: 16px; }
    .muted { color: var(--color-muted); }
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity .5s ease, transform .5s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 4px; }
    @media (max-width: 720px) {
      .shell { padding: 0 18px 64px; }
      .hero-row, .cards, .section-head { grid-template-columns: 1fr; display: grid; }
      .nav { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal, .card, .btn { transition: none; transform: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <a href="#top" class="brand" id="brand"></a>
      <div class="nav-links">
        <a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a>
      </div>
    </nav>
    <main id="app"></main>
  </div>
  <script>
    function icon(path) { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="' + path + '" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
    function esc(v) { return String(v || '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])) }
    function orderedProjects(projects) { return [...projects].sort((a, b) => Number(b.featured) - Number(a.featured)) }
    function renderPortfolio() {
      const p = window.PORTFOLIO
      document.getElementById('brand').textContent = p.user.name
      document.getElementById('app').innerHTML = `
        <section class="hero reveal" id="top">
          <p class="eyebrow">${esc(p.user.title)}</p>
          <div class="hero-row">
            <div>
              <h1>${esc(p.user.name)}</h1>
              <p class="sub">${esc(p.user.tagline)}</p>
              <p class="lead">${esc(p.user.bio)}</p>
              <div class="btns">
                <a class="btn" href="mailto:${esc(p.user.email)}">${icon('M4 6h16v12H4z M22 6l-10 7L2 6')} Email</a>
                <a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">${icon('M12 3v12 M7 10l5 5 5-5 M5 21h14')} Resume</a>
              </div>
            </div>
            <img class="avatar" src="${esc(p.user.avatar)}" alt="${esc(p.user.name)} avatar">
          </div>
        </section>
        <section class="reveal" id="projects">
          <div class="section-head"><h2>Selected Projects</h2><p class="muted">${p.projects.length} case studies</p></div>
          <div class="cards">${orderedProjects(p.projects).map(project => `
            <article class="card reveal">
              <img src="${esc(project.image)}" alt="${esc(project.title)} preview">
              <div class="card-body">
                <h3>${esc(project.title)}</h3>
                <p class="muted">${esc(project.description)}</p>
                <div class="tags" style="margin:14px 0 16px;">${project.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}</div>
                <div class="btns" style="margin-top:0;">
                  <a class="btn" href="${esc(project.liveUrl)}" target="_blank" rel="noreferrer">Live</a>
                  <a class="btn" href="${esc(project.githubUrl)}" target="_blank" rel="noreferrer">Code</a>
                </div>
              </div>
            </article>`).join('')}</div>
        </section>
        <section class="reveal" id="skills">
          <div class="section-head"><h2>Skills</h2><p class="muted">Current strengths</p></div>
          <div class="skills">${p.skills.map(skill => `
            <div>
              <div class="skill-top"><strong>${esc(skill.name)}</strong><span class="muted">${skill.level}%</span></div>
              <div class="bar"><span style="width:${skill.level}%"></span></div>
            </div>`).join('')}</div>
        </section>
        <section class="reveal" id="experience">
          <div class="section-head"><h2>Experience</h2><p class="muted">${esc(p.user.location)}</p></div>
          <div class="timeline">${p.experience.map(item => `
            <article>
              <p class="muted">${esc(item.period)}</p>
              <h3>${esc(item.role)} · ${esc(item.company)}</h3>
              <p>${esc(item.description)}</p>
            </article>`).join('')}</div>
        </section>
        <section class="reveal" id="education">
          <div class="section-head"><h2>Education</h2><p class="muted">Foundation</p></div>
          ${p.education.map(item => `<div class="edu"><h3>${esc(item.degree)}</h3><p>${esc(item.school)} · ${esc(item.period)}</p><p class="muted">${esc(item.note)}</p></div>`).join('')}
        </section>
        <section class="reveal" id="contact">
          <div class="section-head"><h2>Contact</h2><p class="muted">Open to the right problems</p></div>
          <div class="contact-card">
            <div class="contact-list">
              <a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a>
              <a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a>
              <a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GitHub</a>
              <a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">Website</a>
            </div>
          </div>
        </section>`
      observe()
    }
    function observe() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
      const observer = new IntersectionObserver(entries => entries.forEach(entry => entry.isIntersecting && entry.target.classList.add('visible')), { threshold: .1 })
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el))
    }
    window.renderPortfolio = renderPortfolio
    renderPortfolio()
  </script>
</body>
</html>
