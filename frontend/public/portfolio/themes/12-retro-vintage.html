<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro Vintage Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='retro-vintage';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);position:relative}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.06) .8px, transparent .8px);background-size:8px 8px;opacity:.18}
    a,button{cursor:pointer;color:inherit;text-decoration:none}img{display:block;max-width:100%}.shell{max-width:1080px;margin:0 auto;padding:0 22px 80px}.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 0;background:rgba(245,240,232,.95);border-bottom:3px double var(--color-accent)}.links{display:flex;gap:16px}
    .hero{padding-top:62px;text-align:center}.rule{border-top:3px double var(--color-accent);border-bottom:3px double var(--color-accent);padding:18px 0;margin:18px 0}.badge{width:110px;height:110px;border-radius:50%;border:3px double var(--color-accent);display:grid;place-items:center;margin:0 auto 18px;font-family:var(--font-heading);font-size:34px;color:var(--color-accent)}h1,h2,h3{font-family:var(--font-heading);margin:0}
    section{padding-top:58px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.catalog{border:1px solid var(--color-border);padding:18px;background:var(--color-surface)}.catalog img{aspect-ratio:16/10;object-fit:cover;border:3px double var(--color-accent);padding:6px;margin:12px 0}.num{color:var(--color-accent);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    .labels,.contact{display:flex;gap:12px;flex-wrap:wrap}.label,.btn{padding:10px 14px;border:2px solid var(--color-border);background:transparent}.timeline article{padding:14px 0;border-bottom:1px solid var(--color-border)}.smallcaps{text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--color-accent)}
    .divider{height:30px;margin:14px 0;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox=\"0 0 300 30\"><path d=\"M20 15h70c12 0 18-8 24-8s12 8 24 8h142\" fill=\"none\" stroke=\"%23B5451B\" stroke-width=\"2\"/><circle cx=\"150\" cy=\"15\" r=\"4\" fill=\"%23B5451B\"/></svg>') center/contain no-repeat}
    .reveal{opacity:0;transition:opacity .55s ease}.reveal.visible{opacity:1}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start;gap:10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav"><a href="#top" id="brand"></a><div class="links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>
    <main id="app"></main>
  </div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    function initials(name){return name.split(' ').map(part=>part[0]).join('').slice(0,2).toUpperCase()}
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent=p.user.name;document.getElementById('app').innerHTML=`
      <section class="hero reveal" id="top"><div class="badge">${initials(p.user.name)}</div><div class="rule"><h1>${esc(p.user.name)}</h1><p>${esc(p.user.title)}</p></div><p>${esc(p.user.tagline)}</p><p>${esc(p.user.bio)}</p><div class="contact" style="justify-content:center;margin-top:18px"><a class="btn" href="mailto:${esc(p.user.email)}">Email</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">Resume</a></div></section>
      <div class="divider" aria-hidden="true"></div>
      <section id="projects" class="reveal"><h2>Project Catalog</h2><div class="grid">${ordered(p.projects).map((project,index)=>`<article class="catalog reveal"><div class="num">Entry ${String(index+1).padStart(2,'0')}</div><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><h3>${esc(project.title)}</h3><p>${esc(project.description)}</p><div class="labels">${project.tags.map(tag=>`<span class="label">${esc(tag)}</span>`).join('')}</div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><h2>Skill Labels</h2><div class="labels">${p.skills.map(skill=>`<span class="label reveal">${esc(skill.name)} · ${skill.level}%</span>`).join('')}</div></section>
      <section id="experience" class="reveal"><h2>Experience Timeline</h2><div class="timeline">${p.experience.map(item=>`<article class="reveal"><div class="smallcaps">${esc(item.period)}</div><h3>${esc(item.company)}</h3><p>${esc(item.role)}</p><p>${esc(item.description)}</p></article>`).join('')}</div></section>
      <section id="education" class="reveal"><h2>Education</h2><div class="grid">${p.education.map(item=>`<article class="catalog reveal"><h3>${esc(item.degree)}</h3><p>${esc(item.school)}</p><div class="smallcaps">${esc(item.period)}</div><p>${esc(item.note)}</p></article>`).join('')}</div></section>
      <section id="contact" class="reveal"><h2>Contact</h2><div class="contact"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GitHub</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">Website</a></div></section>`;observe()}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
