<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nature Organic Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='nature-organic';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a,button{cursor:pointer;color:inherit;text-decoration:none}img{display:block;max-width:100%}
    .shell{max-width:1120px;margin:0 auto;padding:0 20px 80px;position:relative}.leaf{position:absolute;width:120px;height:120px;stroke:var(--color-accent);fill:none;opacity:.25}.leaf.top{right:10px;top:110px}.leaf.bottom{left:0;bottom:40px}
    .nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 0;background:rgba(244,241,236,.94)}.links{display:flex;gap:16px}
    .hero{padding-top:64px;text-align:center}.frame{position:relative;width:190px;height:190px;margin:0 auto 22px}.frame svg{position:absolute;inset:0;width:100%;height:100%}.avatar{width:140px;height:140px;border-radius:50%;object-fit:cover;position:absolute;inset:25px}
    h1,h2,h3{font-family:var(--font-heading);margin:0;color:var(--color-primary)}h1{font-size:clamp(48px,8vw,88px)}.lead{max-width:62ch;margin:18px auto;line-height:1.85}.wave{height:48px;margin:34px 0;background:var(--color-surface);mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox=\"0 0 1440 120\"><path d=\"M0 64C160 16 320 16 480 64S800 112 960 64s320-48 480 0v56H0z\" fill=\"black\"/></svg>') center/cover no-repeat}
    section{padding-top:56px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,.85)),var(--color-surface);border:1px solid var(--color-border);border-radius:24px;padding:18px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at top left,rgba(92,122,62,.08),transparent 45%);pointer-events:none}.card img{aspect-ratio:16/10;object-fit:cover;border-radius:18px;margin-bottom:14px}
    .tree{display:flex;gap:10px;flex-wrap:wrap}.branch{padding:10px 14px;border-radius:999px;background:rgba(92,122,62,.12);border:1px solid rgba(92,122,62,.2)}.timeline article{padding:16px 0 16px 20px;border-left:1px solid var(--color-border);position:relative}.timeline article:before{content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--color-accent)}
    .contact{display:flex;gap:12px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid var(--color-border);border-radius:999px;background:var(--color-surface)}.reveal{opacity:0;transition:opacity .7s ease}.reveal.visible{opacity:1}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start;gap:10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <svg class="leaf top" viewBox="0 0 100 100" aria-hidden="true"><path d="M22 76C40 54 56 38 78 22M31 67c12 0 22-9 24-20M48 50c10 0 18-7 22-18"/></svg>
    <svg class="leaf bottom" viewBox="0 0 100 100" aria-hidden="true"><path d="M16 72C32 58 46 40 58 20M34 56c10 0 18-6 22-17M46 41c9 0 16-6 20-16"/></svg>
    <nav class="nav"><a href="#top" id="brand"></a><div class="links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>
    <main id="app"></main>
  </div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent=p.user.name;document.getElementById('app').innerHTML=`
      <section class="hero reveal" id="top"><div class="frame"><svg viewBox="0 0 190 190" aria-hidden="true"><path d="M28 98c10-48 56-78 102-64 20 7 35 21 45 40-7 10-18 18-31 21 8 13 10 28 4 43-8 21-29 35-51 36-18 1-35-6-47-18-17-17-26-36-22-58z" stroke="var(--color-accent)" fill="none" stroke-width="2"/></svg><img class="avatar" src="${esc(p.user.avatar)}" alt="${esc(p.user.name)} portrait"></div><h1>${esc(p.user.name)}</h1><p>${esc(p.user.title)}</p><p class="lead">${esc(p.user.tagline)} ${esc(p.user.bio)}</p><div class="contact" style="justify-content:center"><a class="btn" href="mailto:${esc(p.user.email)}">Email</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">Resume</a></div></section>
      <div class="wave" aria-hidden="true"></div>
      <section id="projects" class="reveal"><h2>Projects</h2><div class="grid">${ordered(p.projects).map(project=>`<article class="card reveal"><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><h3>${esc(project.title)}</h3><p>${esc(project.description)}</p><div class="tree">${project.tags.map(tag=>`<span class="branch">${esc(tag)}</span>`).join('')}</div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><h2>Skills</h2><div class="tree">${p.skills.map(skill=>`<span class="branch reveal">${esc(skill.name)} · ${skill.level}%</span>`).join('')}</div></section>
      <section id="experience" class="reveal"><h2>Experience</h2><div class="timeline">${p.experience.map(item=>`<article class="reveal"><p>${esc(item.period)}</p><h3>${esc(item.role)} · ${esc(item.company)}</h3><p>${esc(item.description)}</p></article>`).join('')}</div></section>
      <section id="education" class="reveal"><h2>Education</h2><div class="grid">${p.education.map(item=>`<article class="card reveal"><h3>${esc(item.degree)}</h3><p>${esc(item.school)}</p><p>${esc(item.period)}</p><p>${esc(item.note)}</p></article>`).join('')}</div></section>
      <section id="contact" class="reveal"><h2>Contact</h2><div class="contact"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GitHub</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">Website</a></div></section>`;observe()}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
