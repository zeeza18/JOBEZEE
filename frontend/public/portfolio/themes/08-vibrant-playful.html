<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibrant Playful Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='vibrant-playful';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a,button{cursor:pointer;color:inherit;text-decoration:none}img{display:block;max-width:100%}
    :root{--support-1:#14b8a6;--support-2:#facc15;--support-3:#8b5cf6}.shell{max-width:1160px;margin:0 auto;padding:0 20px 80px}.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 0;background:rgba(255,251,240,.94)}.links{display:flex;gap:16px}
    section{padding-top:62px}.hero-card{background:var(--color-accent);padding:28px;border-radius:36px;color:#fff}.hero-card h1{font-family:var(--font-heading);font-size:clamp(44px,8vw,84px);line-height:.94;margin:0}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center}
    .avatar{width:100%;border-radius:28px;object-fit:cover;border:4px solid #fff}.wave{height:26px;background:linear-gradient(90deg,var(--color-accent) 25%,var(--support-1) 25% 50%,var(--support-2) 50% 75%,var(--support-3) 75%);clip-path:polygon(0 40%,8% 0,16% 40%,24% 0,32% 40%,40% 0,48% 40%,56% 0,64% 40%,72% 0,80% 40%,88% 0,96% 40%,100% 20%,100% 100%,0 100%)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:3px solid var(--color-accent);border-radius:24px;padding:16px;background:#fff;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}.card:nth-child(2n){border-color:var(--support-1)}.card:nth-child(3n){border-color:var(--support-2)}.card:nth-child(4n){border-color:var(--support-3)}.card:hover,.btn:hover{transform:translateY(-4px) scale(1.01)}
    .card img{border-radius:18px;aspect-ratio:16/10;object-fit:cover;margin-bottom:12px}.tags,.buttons,.bubbles,.contact{display:flex;gap:12px;flex-wrap:wrap}.tag,.btn{padding:10px 14px;border-radius:999px;border:2px solid currentColor}.skill{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.pct{font-family:var(--font-heading);font-size:42px}
    .confetti{display:flex;gap:6px}.confetti span{width:8px;height:8px;border-radius:50%}.bubble{position:relative;padding:18px 18px 18px 22px;border-radius:24px;background:#fff;border:2px solid var(--color-border)}.bubble:before{content:"";position:absolute;left:18px;bottom:-12px;border:12px solid transparent;border-top-color:#fff}
    .reveal{opacity:0;transform:translateY(22px);transition:opacity .45s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}.reveal.visible{opacity:1;transform:none}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
    @media(max-width:820px){.hero-grid,.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal,.btn,.card{opacity:1;transform:none;transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav"><a href="#top" id="brand"></a><div class="links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>
    <main id="app"></main>
  </div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    const dots='<span style="background:var(--color-accent)"></span><span style="background:var(--support-1)"></span><span style="background:var(--support-2)"></span><span style="background:var(--support-3)"></span>'
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent=p.user.name;document.getElementById('app').innerHTML=`
      <section class="reveal" id="top"><div class="hero-card"><div class="hero-grid"><div><p style="margin:0 0 12px">${esc(p.user.title)}</p><h1>${esc(p.user.name)}</h1><p>${esc(p.user.tagline)}</p><div class="buttons" style="margin-top:22px"><a class="btn" href="mailto:${esc(p.user.email)}">Email</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">Resume</a></div></div><img class="avatar" src="${esc(p.user.avatar)}" alt="${esc(p.user.name)} portrait"></div></div><div class="wave" aria-hidden="true"></div></section>
      <section id="projects" class="reveal"><h2>Projects</h2><div class="grid">${ordered(p.projects).map(project=>`<article class="card reveal"><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><h3>${esc(project.title)}</h3><p>${esc(project.description)}</p><div class="tags">${project.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><h2>Skills</h2><div class="grid">${p.skills.map(skill=>`<article class="card skill reveal"><div><strong>${esc(skill.name)}</strong><div class="confetti">${dots}</div></div><div class="pct">${skill.level}%</div></article>`).join('')}</div></section>
      <section id="experience" class="reveal"><h2>Experience</h2><div class="bubbles">${p.experience.map(item=>`<article class="bubble reveal"><p style="color:var(--color-accent)">${esc(item.period)}</p><h3>${esc(item.role)} · ${esc(item.company)}</h3><p>${esc(item.description)}</p></article>`).join('')}</div></section>
      <section id="education" class="reveal"><h2>Education</h2><div class="grid">${p.education.map(item=>`<article class="card reveal"><h3>${esc(item.degree)}</h3><p>${esc(item.school)}</p><p>${esc(item.period)}</p><p>${esc(item.note)}</p></article>`).join('')}</div></section>
      <section id="contact" class="reveal"><h2>Contact</h2><div class="contact"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GitHub</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">Website</a></div></section>`;observe()}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
