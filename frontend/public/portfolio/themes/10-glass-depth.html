<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glass Depth Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='glass-depth';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);overflow-x:hidden}a,button{cursor:pointer;color:inherit;text-decoration:none}img{display:block;max-width:100%}
    .bg{position:fixed;inset:-10%;z-index:-1;filter:blur(50px)}.blob{position:absolute;border-radius:50%;opacity:.55;animation:float 16s ease-in-out infinite}.b1{width:420px;height:420px;background:#7B3FE4;left:5%;top:8%}.b2{width:360px;height:360px;background:#2563EB;right:10%;top:16%;animation-delay:-4s}.b3{width:460px;height:460px;background:#E040FB;left:30%;bottom:0;animation-delay:-8s}
    .shell{max-width:1180px;margin:0 auto;padding:16px 20px 80px}.glass{background:var(--color-surface);backdrop-filter:blur(16px);border:1px solid var(--color-border);border-radius:20px}.nav{position:sticky;top:16px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 18px}.links{display:flex;gap:16px}
    section{padding-top:42px}.hero{min-height:86vh;display:grid;place-items:center;text-align:center}.hero-card{max-width:720px;padding:34px}.hero h1{font-family:var(--font-heading);font-size:clamp(44px,8vw,84px);margin:0}.gradient-text{background:linear-gradient(90deg,#fff,var(--color-accent),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;margin:0 auto 16px;border:1px solid rgba(255,255,255,.22)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{padding:18px;animation:float 9s ease-in-out infinite}.card:hover{transform:scale(1.02);border-color:rgba(255,255,255,.28)}.card img{aspect-ratio:16/10;object-fit:cover;border-radius:16px;margin-bottom:14px}
    .pills,.contact{display:flex;gap:12px;flex-wrap:wrap}.pill,.btn{padding:10px 14px;border:1px solid var(--color-border);border-radius:999px;background:rgba(255,255,255,.08)}.timeline article{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    .reveal{opacity:0;transform:translateY(22px);transition:opacity .5s ease,transform .5s ease}.reveal.visible{opacity:1;transform:none}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start;gap:10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.blob,.card,.reveal{animation:none;transition:none;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="shell">
    <nav class="nav glass"><a href="#top" id="brand"></a><div class="links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>
    <main id="app"></main>
  </div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent=p.user.name;document.getElementById('app').innerHTML=`
      <section class="hero reveal" id="top"><div class="hero-card glass"><img class="avatar" src="${esc(p.user.avatar)}" alt="${esc(p.user.name)} portrait"><h1>${esc(p.user.name)}</h1><p>${esc(p.user.title)}</p><p class="gradient-text">${esc(p.user.tagline)}</p><p>${esc(p.user.bio)}</p><div class="contact" style="justify-content:center;margin-top:20px"><a class="btn" href="mailto:${esc(p.user.email)}">Email</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">Resume</a></div></div></section>
      <section id="projects" class="reveal"><h2>Projects</h2><div class="grid">${ordered(p.projects).map(project=>`<article class="card glass reveal"><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><h3>${esc(project.title)}</h3><p>${esc(project.description)}</p><div class="pills">${project.tags.map(tag=>`<span class="pill">${esc(tag)}</span>`).join('')}</div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><h2>Skills</h2><div class="pills">${p.skills.map(skill=>`<span class="pill reveal">${esc(skill.name)} · ${skill.level}%</span>`).join('')}</div></section>
      <section id="experience" class="reveal"><div class="glass card timeline">${p.experience.map(item=>`<article class="reveal"><p>${esc(item.period)}</p><h3>${esc(item.role)} · ${esc(item.company)}</h3><p>${esc(item.description)}</p></article>`).join('')}</div></section>
      <section id="education" class="reveal"><div class="grid">${p.education.map(item=>`<article class="card glass reveal"><h3>${esc(item.degree)}</h3><p>${esc(item.school)}</p><p>${esc(item.period)}</p><p>${esc(item.note)}</p></article>`).join('')}</div></section>
      <section id="contact" class="reveal"><div class="glass card"><h2>Contact</h2><div class="contact"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GitHub</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">Website</a></div></div></section>`;observe()}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
