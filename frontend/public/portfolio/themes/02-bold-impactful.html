<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bold Impactful Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='bold-impactful';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a,button{cursor:pointer}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}
    .wrap{padding:0 24px 80px}.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 0;background:rgba(10,10,10,.95);border-bottom:1px solid var(--color-border)}.nav a{font-size:12px;text-transform:uppercase;letter-spacing:.22em}
    .hero{min-height:100vh;display:grid;align-content:center;padding:48px 0}.hero h1{font-family:var(--font-heading);font-size:clamp(80px,16vw,160px);line-height:.88;margin:0;letter-spacing:.02em}.accent{color:var(--color-accent)}
    .cursor{display:inline-block;width:16px;height:1em;background:var(--color-accent);animation:blink .9s steps(1) infinite;vertical-align:middle}.rule{height:4px;background:var(--color-accent);margin:26px 0 18px}.eyebrow,.section-title{letter-spacing:.2em;text-transform:uppercase}
    .lead{max-width:52ch;color:var(--color-muted);font-size:18px;line-height:1.7}.btns,.links,.tags{display:flex;gap:12px;flex-wrap:wrap}.btn{border:1px solid var(--color-border);padding:12px 16px;background:transparent;transition:.24s ease}.btn:hover,.project:hover{background:color-mix(in srgb,var(--color-accent) 14%, transparent)}
    section{padding-top:72px}.section-title{font-size:14px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--color-border)}.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;overflow:auto}
    .project{background:var(--color-surface);border-left:6px solid var(--color-accent);padding:18px;min-width:280px;transition:background .25s ease,transform .25s ease}.project:hover{transform:translateY(-4px)}.project img{aspect-ratio:16/10;object-fit:cover;margin-bottom:12px}
    .tags span{padding:6px 8px;background:rgba(255,255,255,.05);font-size:12px}.skills{display:grid;gap:14px}.stack{display:grid;gap:6px}.stack .bar{height:18px;background:#202020;border:1px solid var(--color-border)}.stack .bar span{display:block;height:100%;background:var(--color-accent)}
    .exp article{display:grid;grid-template-columns:90px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--color-border)}.num{font-family:var(--font-heading);font-size:54px;color:var(--color-accent);line-height:.8}
    .reveal{opacity:0;transform:translateX(-36px);transition:opacity .55s ease,transform .55s ease}.reveal.visible{opacity:1;transform:none}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}@keyframes blink{50%{opacity:0}}
    @media(max-width:980px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.wrap{padding:0 16px 56px}.nav{flex-direction:column;align-items:flex-start;gap:10px}.projects{grid-template-columns:1fr}.exp article{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal,.project,.btn,.cursor{transition:none;animation:none;transform:none;opacity:1}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav"><a href="#top" id="brand"></a><div class="links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>
    <main id="app"></main>
  </div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent=p.user.name.toUpperCase();document.getElementById('app').innerHTML=`
      <section class="hero reveal" id="top">
        <div class="eyebrow accent">${esc(p.user.title)}</div>
        <h1>${esc(p.user.name.split(' ')[0])}<br><span class="accent">${esc(p.user.name.split(' ').slice(1).join(' ')||p.user.name)}</span> <span class="cursor" aria-hidden="true"></span></h1>
        <div class="rule"></div>
        <p class="lead">${esc(p.user.tagline)} ${esc(p.user.bio)}</p>
        <div class="btns" style="margin-top:24px"><a class="btn" href="mailto:${esc(p.user.email)}">EMAIL</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">RESUME</a></div>
      </section>
      <section id="projects" class="reveal"><div class="section-title">Projects</div><div class="projects">${ordered(p.projects).map((project,index)=>`<article class="project reveal"><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><div class="accent">${String(index+1).padStart(2,'0')}</div><h2>${esc(project.title)}</h2><p>${esc(project.description)}</p><div class="tags">${project.tags.map(tag=>`<span>${esc(tag)}</span>`).join('')}</div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><div class="section-title">Skills</div><div class="skills">${p.skills.map(skill=>`<div class="stack"><div style="display:flex;justify-content:space-between"><strong>${esc(skill.name)}</strong><span class="accent">${skill.level}%</span></div><div class="bar"><span style="width:${skill.level}%"></span></div></div>`).join('')}</div></section>
      <section id="experience" class="reveal"><div class="section-title">Experience</div><div class="exp">${p.experience.map((item,index)=>`<article class="reveal"><div class="num">${String(index+1).padStart(2,'0')}</div><div><p class="accent">${esc(item.period)}</p><h2>${esc(item.role)} / ${esc(item.company)}</h2><p>${esc(item.description)}</p></div></article>`).join('')}</div></section>
      <section id="education" class="reveal"><div class="section-title">Education</div>${p.education.map(item=>`<article class="project reveal"><h2>${esc(item.degree)}</h2><p class="accent">${esc(item.school)}</p><p>${esc(item.period)}</p><p>${esc(item.note)}</p></article>`).join('')}</section>
      <section id="contact" class="reveal"><div class="section-title">Contact</div><div class="btns"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LINKEDIN</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GITHUB</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">WEBSITE</a></div></section>`;observe()}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
