<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Cyber Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='tech-cyber';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);background-image:linear-gradient(rgba(15,32,48,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(15,32,48,.45) 1px,transparent 1px);background-size:34px 34px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03),rgba(255,255,255,.03) 1px,transparent 1px,transparent 4px);opacity:.03}
    a,button{cursor:pointer;color:inherit;text-decoration:none}img{display:block;max-width:100%}.shell{max-width:1180px;margin:0 auto;padding:0 20px 80px}.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-top:18px;border:1px solid var(--color-border);background:rgba(7,16,24,.88)}.path{color:var(--color-primary)}.links{display:flex;gap:16px}
    section{padding-top:64px}.hero{min-height:82vh;display:grid;align-content:center;gap:14px}.hero h1{margin:0;font-family:var(--font-heading);font-size:clamp(42px,7vw,88px);color:var(--color-primary)}.typed{min-height:28px;color:var(--color-accent)}.cursor{animation:blink .9s steps(1) infinite}.btns,.tags,.contact{display:flex;gap:12px;flex-wrap:wrap}.btn,.tag{padding:12px 14px;border:1px solid var(--color-border);background:rgba(0,255,136,.03)}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.term{border:1px solid var(--color-border);background:var(--color-surface)}.term-top{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--color-border)}.dot{width:10px;height:10px;border-radius:50%}.term-body{padding:16px}.term img{aspect-ratio:16/10;object-fit:cover;margin-bottom:14px}
    .bar{font-family:var(--font-heading);white-space:pre}.log article{padding:10px 0;border-bottom:1px solid rgba(15,32,48,.6)}.flicker{animation:flicker 2.8s infinite}.reveal{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}.reveal.visible{opacity:1;transform:none}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
    @keyframes blink{50%{opacity:0}}@keyframes flicker{96%{opacity:1}97%{opacity:.7}98%{opacity:1}99%{opacity:.85}100%{opacity:1}}@media(max-width:820px){.cards{grid-template-columns:1fr}.nav{flex-direction:column;align-items:flex-start;gap:10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal,.flicker,.cursor{transition:none;animation:none;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav"><div class="path" id="brand"></div><div class="links"><a href="#projects">projects</a><a href="#skills">skills</a><a href="#experience">experience</a><a href="#education">education</a><a href="#contact">contact</a></div></nav>
    <main id="app"></main>
  </div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    const bar=v=>'['+'█'.repeat(Math.max(1,Math.round(v/10)))+'░'.repeat(10-Math.max(1,Math.round(v/10)))+'] '+String(v).padStart(3,' ')+'%'
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent='~/portfolio/' + p.user.name.toLowerCase().replace(/\s+/g,'-');document.getElementById('app').innerHTML=`
      <section class="hero reveal" id="top"><div class="flicker" style="color:var(--color-primary)">$ whoami</div><h1>${esc(p.user.name)}</h1><div class="typed" id="typed"></div><p>> ${esc(p.user.bio)}</p><div class="btns"><a class="btn" href="mailto:${esc(p.user.email)}">mail --open</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">resume --download</a></div></section>
      <section id="projects" class="reveal"><h2 class="flicker">> projects</h2><div class="cards">${ordered(p.projects).map(project=>`<article class="term reveal"><div class="term-top"><span class="dot" style="background:#ef4444"></span><span class="dot" style="background:#f59e0b"></span><span class="dot" style="background:#22c55e"></span></div><div class="term-body"><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><h3>> ${esc(project.title)}</h3><p>${esc(project.description)}</p><div class="tags">${project.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div></div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><h2 class="flicker">> skills</h2>${p.skills.map(skill=>`<p class="bar">${esc(skill.name).padEnd(20,' ')} ${bar(skill.level)}</p>`).join('')}</section>
      <section id="experience" class="reveal"><h2 class="flicker">> git log --experience</h2><div class="log">${p.experience.map(item=>`<article class="reveal">● [${esc(item.period)}] ${esc(item.company)} - ${esc(item.role)}<br><span style="color:var(--color-muted)">${esc(item.description)}</span></article>`).join('')}</div></section>
      <section id="education" class="reveal"><h2 class="flicker">> education</h2><div class="log">${p.education.map(item=>`<article class="reveal">${esc(item.degree)} @ ${esc(item.school)}<br><span style="color:var(--color-muted)">${esc(item.period)} · ${esc(item.note)}</span></article>`).join('')}</div></section>
      <section id="contact" class="reveal"><h2 class="flicker">> contact</h2><div class="contact"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">linkedin</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">github</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">website</a></div></section>`;typeTitle(p.user.title);observe()}
    function typeTitle(text){const el=document.getElementById('typed');if(!el)return;let i=0;el.textContent='';const timer=setInterval(()=>{el.innerHTML='> '+text.slice(0,i)+'<span class="cursor">|</span>';i+=1;if(i>text.length){clearInterval(timer)}},35)}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){const el=document.getElementById('typed');if(el)el.textContent='> '+window.PORTFOLIO.user.title;return}const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
