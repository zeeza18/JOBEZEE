<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warm Human Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='warm-human';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a,button{cursor:pointer}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}
    .shell{max-width:1160px;margin:0 auto}.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:rgba(250,247,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-border)}.nav-links{display:flex;gap:16px;color:var(--color-muted)}
    section{padding:76px 24px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;background:linear-gradient(180deg,transparent,rgba(192,98,43,.05))}h1,h2,h3{font-family:var(--font-heading);margin:0}.hero h1{font-size:clamp(42px,8vw,86px)}.avatar-wrap{position:relative}.avatar-wrap:after{content:"";position:absolute;inset:12px 12px auto auto;width:100%;height:100%;background:rgba(192,98,43,.12);border-radius:20px;transform:translate(14px,14px);z-index:0}.avatar{position:relative;z-index:1;border-radius:20px;min-height:420px;object-fit:cover;box-shadow:0 28px 60px rgba(44,36,22,.12);filter:saturate(.92)}
    .lead{font-size:18px;line-height:1.8;max-width:58ch}.btns,.tags,.dots,.contact{display:flex;gap:12px;flex-wrap:wrap}.btn{padding:12px 18px;border-radius:999px;border:1px solid var(--color-border);background:var(--color-surface)}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}.card img{border-radius:14px;aspect-ratio:16/10;object-fit:cover;margin-bottom:14px}
    .dot-skill{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.dots span{width:14px;height:14px;border-radius:50%;background:var(--color-border)}.dots span.fill{background:var(--color-accent)}
    .story{display:grid;gap:16px}.story article{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start}.badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(192,98,43,.12);color:var(--color-accent);font-weight:800}
    .wave{height:46px;background:linear-gradient(180deg,transparent 0 42%,rgba(192,98,43,.08) 42% 58%,transparent 58%);mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox=\"0 0 1440 120\"><path d=\"M0 50 C180 100 320 0 520 40 S860 120 1080 60 1300 0 1440 50V120H0Z\" fill=\"black\"/></svg>') center/cover no-repeat}
    .reveal{opacity:0;transition:opacity .55s ease}.reveal.visible{opacity:1}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
    @media(max-width:860px){.hero,.grid,.story article{grid-template-columns:1fr}.avatar{min-height:320px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transition:none}}
  </style>
</head>
<body>
  <nav class="nav"><a href="#top" id="brand"></a><div class="nav-links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>
  <main id="app"></main>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    const dotCount=v=>Array.from({length:5},(_,i)=>`<span class="${i<Math.round(v/20)?'fill':''}"></span>`).join('')
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent=p.user.name;document.getElementById('app').innerHTML=`
      <section class="hero reveal" id="top"><div><p style="color:var(--color-accent);letter-spacing:.16em;text-transform:uppercase">${esc(p.user.title)}</p><h1>${esc(p.user.name)}</h1><p style="font-size:24px;color:var(--color-muted)">${esc(p.user.tagline)}</p><p class="lead">${esc(p.user.bio)}</p><div class="btns" style="margin-top:24px"><a class="btn" href="mailto:${esc(p.user.email)}">Email</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">Resume</a></div></div><div class="avatar-wrap"><img class="avatar" src="${esc(p.user.avatar)}" alt="${esc(p.user.name)} portrait"></div></section>
      <div class="wave" aria-hidden="true"></div>
      <section id="projects" class="reveal" style="background:var(--color-surface)"><div class="title"><h2>Projects</h2><span>${esc(p.user.location)}</span></div><div class="grid">${ordered(p.projects).map(project=>`<article class="card reveal"><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><h3>${esc(project.title)}</h3><p>${esc(project.description)}</p><div class="tags">${project.tags.map(tag=>`<span class="btn">${esc(tag)}</span>`).join('')}</div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><div class="title"><h2>Skills</h2><span>Calm, rounded, human-centered</span></div><div class="grid">${p.skills.map(skill=>`<article class="card dot-skill reveal"><div><strong>${esc(skill.name)}</strong><p style="color:var(--color-muted)">${skill.level}% confidence</p></div><div class="dots">${dotCount(skill.level)}</div></article>`).join('')}</div></section>
      <section id="experience" class="reveal" style="background:var(--color-surface)"><div class="title"><h2>Experience</h2><span>Story arcs</span></div><div class="story">${p.experience.map(item=>`<article class="reveal"><div class="badge">${esc(item.company.slice(0,2).toUpperCase())}</div><div><p style="color:var(--color-accent)">${esc(item.period)}</p><h3>${esc(item.role)} · ${esc(item.company)}</h3><p>${esc(item.description)}</p></div></article>`).join('')}</div></section>
      <section id="education" class="reveal"><div class="title"><h2>Education</h2><span>Learning foundations</span></div><div class="grid">${p.education.map(item=>`<article class="card reveal"><h3>${esc(item.degree)}</h3><p>${esc(item.school)}</p><p style="color:var(--color-muted)">${esc(item.period)}</p><p>${esc(item.note)}</p></article>`).join('')}</div></section>
      <section id="contact" class="reveal" style="background:var(--color-surface)"><div class="title"><h2>Contact</h2><span>Let's build useful things</span></div><div class="contact"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GitHub</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">Website</a></div></section>`;observe()}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
