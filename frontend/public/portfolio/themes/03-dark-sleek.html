<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Sleek Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="../portfolio-config.js"></script>
  <script>const THEME_SLUG='dark-sleek';Object.entries(window.PORTFOLIO.themes[THEME_SLUG]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))</script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a,button{cursor:pointer}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}
    .shell{max-width:1160px;margin:0 auto;padding:0 24px 80px}.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 0;background:rgba(13,13,13,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--color-border)}.links{display:flex;gap:18px;color:var(--color-accent)}
    .hero{min-height:92vh;display:grid;place-items:center;text-align:center;position:relative;padding-top:72px}.glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--color-accent),transparent 65%);filter:blur(55px);opacity:.16}
    .avatar{position:relative;width:112px;height:112px;border-radius:50%;border:2px solid var(--color-accent);object-fit:cover;margin:0 auto 24px;box-shadow:0 0 0 10px rgba(201,169,110,.06)}h1,h2,h3{font-family:var(--font-heading);margin:0}.hero h1{font-size:clamp(44px,8vw,84px)}.sub{color:var(--color-accent);margin:10px 0 14px}
    .shimmer{width:220px;height:1px;margin:24px auto;background:linear-gradient(90deg,transparent,var(--color-accent),transparent);animation:shimmer 2.6s linear infinite}.actions,.tags,.contact{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn,.tag{padding:12px 16px;border-radius:999px;border:1px solid var(--color-border);background:rgba(255,255,255,.02);transition:.24s ease}.btn:hover,.card:hover{transform:translateY(-4px);box-shadow:0 0 24px rgba(201,169,110,.12)}section{padding-top:72px}
    .title{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--color-surface);border:1px solid var(--color-accent);border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(201,169,110,.08);transition:.25s ease}.card img{aspect-ratio:16/9;object-fit:cover}.card-body{padding:18px}
    .svg-ring{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.ring{padding:18px;border:1px solid var(--color-border);border-radius:22px;background:rgba(255,255,255,.02);text-align:center}.ring svg{width:108px;height:108px;display:block;margin:0 auto 12px}
    .timeline{position:relative;padding-left:24px;display:grid;gap:20px}.timeline:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--color-border)}.timeline article{position:relative}.timeline article:before{content:"";position:absolute;left:-20px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--color-accent)}
    .reveal{opacity:0;transform:translateY(28px);transition:opacity .55s ease,transform .55s ease}.reveal.visible{opacity:1;transform:none}:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
    @keyframes shimmer{0%{transform:translateX(-20px)}50%{transform:translateX(20px)}100%{transform:translateX(-20px)}}@media(max-width:860px){.grid,.svg-ring{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal,.card,.btn,.shimmer{opacity:1;transform:none;transition:none;animation:none}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav"><a href="#top" id="brand"></a><div class="links"><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></div></nav>
    <main id="app"></main>
  </div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))
    const ordered=p=>[...p].sort((a,b)=>Number(b.featured)-Number(a.featured))
    const ring=(value)=>{const r=44,c=2*Math.PI*r,d=c-(value/100)*c;return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="8" fill="none"/><circle cx="60" cy="60" r="${r}" stroke="var(--color-accent)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${d}" transform="rotate(-90 60 60)"/></svg>`}
    function renderPortfolio(){const p=window.PORTFOLIO;document.getElementById('brand').textContent=p.user.name;document.getElementById('app').innerHTML=`
      <section class="hero reveal" id="top"><div class="glow" aria-hidden="true"></div><div><img class="avatar" src="${esc(p.user.avatar)}" alt="${esc(p.user.name)} avatar"><h1>${esc(p.user.name)}</h1><p class="sub">${esc(p.user.title)}</p><p>${esc(p.user.tagline)}</p><div class="shimmer" aria-hidden="true"></div><div class="actions"><a class="btn" href="mailto:${esc(p.user.email)}">Email</a><a class="btn" href="${esc(p.user.resumeUrl)}" target="_blank" rel="noreferrer">Resume</a></div></div></section>
      <section id="projects" class="reveal"><div class="title"><h2>Projects</h2><span>${esc(p.user.location)}</span></div><div class="grid">${ordered(p.projects).map(project=>`<article class="card reveal"><img src="${esc(project.image)}" alt="${esc(project.title)} preview"><div class="card-body"><h3>${esc(project.title)}</h3><p>${esc(project.description)}</p><div class="tags">${project.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div></div></article>`).join('')}</div></section>
      <section id="skills" class="reveal"><div class="title"><h2>Skills</h2><span>Premium systems and product craft</span></div><div class="svg-ring">${p.skills.map(skill=>`<article class="ring reveal">${ring(skill.level)}<h3>${esc(skill.name)}</h3><p>${skill.level}%</p></article>`).join('')}</div></section>
      <section id="experience" class="reveal"><div class="title"><h2>Experience</h2><span>Selected roles</span></div><div class="timeline">${p.experience.map(item=>`<article class="reveal"><p class="sub">${esc(item.period)}</p><h3>${esc(item.role)} · ${esc(item.company)}</h3><p>${esc(item.description)}</p></article>`).join('')}</div></section>
      <section id="education" class="reveal"><div class="title"><h2>Education</h2><span>Formal study</span></div><div class="grid">${p.education.map(item=>`<article class="card reveal"><div class="card-body"><h3>${esc(item.degree)}</h3><p>${esc(item.school)}</p><p class="sub">${esc(item.period)}</p><p>${esc(item.note)}</p></div></article>`).join('')}</div></section>
      <section id="contact" class="reveal"><div class="title"><h2>Contact</h2><span>Available for select work</span></div><div class="contact"><a class="btn" href="mailto:${esc(p.user.email)}">${esc(p.user.email)}</a><a class="btn" href="${esc(p.user.linkedin)}" target="_blank" rel="noreferrer">LinkedIn</a><a class="btn" href="${esc(p.user.github)}" target="_blank" rel="noreferrer">GitHub</a><a class="btn" href="${esc(p.user.website)}" target="_blank" rel="noreferrer">Website</a></div></section>`;observe()}
    function observe(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>o.observe(el))}
    window.renderPortfolio=renderPortfolio;renderPortfolio()
  </script>
</body>
</html>
